<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMSQR Hub</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, sans-serif; padding: 20px; background: #f9f9f9; }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        /* Enforces a 1:1 Aspect Ratio (Square) */
.square-preview {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 12px;
    overflow: hidden;
    aspect-ratio: 1 / 1; 
    display: flex;
    flex-direction: column;
    box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    position: relative; /* Required for the scaling math */
}

/* Wrapper to isolate the scaled content and prevent layout breaking */
.iframe-wrapper {
    flex: 1;
    width: 100%;
    position: relative;
    overflow: hidden; /* Crops out anything that spills during the scale */
}

/* The active webpage preview */
.square-preview iframe {
    /* Step 1: Tell the browser it is drawing a huge desktop screen */
    width: 1200px;
    height: 1200px;
    border: none;
    background: #fff;
    pointer-events: none; /* Prevents scrolling or clicking inside */

    /* Step 2: Push it to the top left edge */
    position: absolute;
    top: 0;
    left: 0;
    transform-origin: 0 0; /* Anchor scale from top-left corner */

    /* Step 3: Zoom it out heavily to fit the frame */
    /* Adjust this percentage up or down depending on how small you want the text to look */
    transform: scale(0.25); 
}

/* Label at the bottom */
.preview-label {
    background: #fff;
    color: #24292f;
    padding: 12px;
    text-align: center;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    border-top: 1px solid #eee;
    z-index: 10; /* Ensures it stays above the scaled iframe */
}
    </style>
</head>
<body>

    <h1 style="text-align: center; margin: 20px 0 40px;">Auto-Generated Previews</h1>
    <div class="grid-container" id="gallery"></div>

   <script>
        const GITHUB_USERNAME = "amsqr"; 
        const REPO_NAME = "amsqr.github.com";

        const gallery = document.getElementById('gallery');

        async function loadPreviews() {
            try {
                const response = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/`);
                
                if (!response.ok) {
                    throw new Error(`GitHub API error! Status: ${response.status}`);
                }

                const files = await response.json();
                gallery.innerHTML = '';

                files.forEach(file => {
                    if (file.name.endsWith('.html') && file.name !== 'index.html') {
                        const card = document.createElement('div');
                        card.className = 'square-preview';

                        card.innerHTML = `
                            <div class="iframe-wrapper">
                                <iframe src="./${file.name}"></iframe>
                            </div>
                            <a href="./${file.name}" class="preview-label">${file.name.replace('.html', '')}</a>
                        `;

                        gallery.appendChild(card);
                    }
                });

                if (gallery.innerHTML === '') {
                    gallery.innerHTML = "<p>No other HTML files found in the repository.</p>";
                }

            } catch (error) {
                console.error("Error loading GitHub directory:", error);
                gallery.innerHTML = `<p>Error loading files: ${error.message}</p>`;
            } // <-- This was missing
        } // <-- This was missing

        loadPreviews();
    </script>
</body>
</html>
