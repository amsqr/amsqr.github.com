<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMSQR Hub</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, sans-serif; padding: 20px; background: #f9f9f9; }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .square-preview {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 1 / 1; 
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .square-preview iframe { flex: 1; width: 100%; border: none; pointer-events: none; }
        .preview-label {
            background: #fff;
            color: #24292f;
            padding: 12px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            border-top: 1px solid #eee;
        }
        .preview-label:hover { color: #0969da; }
    </style>
</head>
<body>

    <h1 style="text-align: center; margin: 20px 0 40px;">Auto-Generated Previews</h1>
    <div class="grid-container" id="gallery"></div>

    <script>
       const GITHUB_USERNAME = "amsqr"; 
const REPO_NAME = "amsqr.github.com"; // This is the exact name of your repo

const gallery = document.getElementById('gallery');

async function loadPreviews() {
    try {
        // CORRECTED: Pointing to api.github.com with the proper path structure
        const response = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/`);
        
        if (!response.ok) {
            throw new Error(`GitHub API error! Status: ${response.status}`);
        }

        const files = await response.json();

        // Clear loading text if you have any
        gallery.innerHTML = '';

        files.forEach(file => {
            // Target only other HTML files, excluding index.html itself
            if (file.name.endsWith('.html') && file.name !== 'index.html') {
                
                const card = document.createElement('div');
                card.className = 'square-preview';

                // Set the iframe and link to point to the file
                card.innerHTML = `
                    <iframe src="./${file.name}"></iframe>
                    <a href="./${file.name}" class="preview-label">${file.name.replace('.html', '')}</a>
                `;

                gallery.appendChild(card);
            }
        });

        loadPreviews();
    </script>
</body>
</html>
