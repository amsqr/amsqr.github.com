let promptIdx = 0; let frame = 0; let scrollX = 400; let vScrollY = 320; let speedMultiplier = 1;
let isHackingAttempt = false; let isFinalState = false; let isCrashed = false; let isRebooting = false;

let subY = 0;

let audioCtx = null; let audioStarted = false; let nextNoteTime = 0; let noteIndex = 0; let sidFilter = null;
const tempo = 0.125;

function initAudio() {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    sidFilter = audioCtx.createBiquadFilter();
    sidFilter.type = 'lowpass';
    sidFilter.frequency.setValueAtTime(2200, audioCtx.currentTime);
    sidFilter.Q.setValueAtTime(10, audioCtx.currentTime);
    sidFilter.connect(audioCtx.destination);
    nextNoteTime = audioCtx.currentTime;
}

function playSpeech(type) {
    if(!audioCtx) return;
    const now = audioCtx.currentTime;
    const len = 0.12;
    const freqs = type === 'hack' ? [500, 250, 700, 150] : [800, 450, 1000, 350];
    freqs.forEach((f, i) => {
        const noise = audioCtx.createBufferSource();
        const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * len, audioCtx.sampleRate);
        const d = buf.getChannelData(0);
        for(let j=0; j<d.length; j++) d[j] = Math.random() * 2 - 1;
        noise.buffer = buf;
        const filt = audioCtx.createBiquadFilter();
        filt.type = 'bandpass'; filt.frequency.setValueAtTime(f, now + i*len); filt.Q.setValueAtTime(20, now + i*len);
        const g = audioCtx.createGain();
        g.gain.setValueAtTime(0, now + i*len);
        g.gain.linearRampToValueAtTime(0.4, now + i*len + 0.01);
        g.gain.exponentialRampToValueAtTime(0.001, now + i*len + len - 0.01);
        noise.connect(filt); filt.connect(g); g.connect(audioCtx.destination);
        noise.start(now + i*len); noise.stop(now + i*len + len);
    });
}

function playSnare(startTime) {
    if(!audioCtx) return;
    const noise = audioCtx.createBufferSource();
    const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.1, audioCtx.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0; i<d.length; i++) d[i] = Math.random() * 2 - 1;
    noise.buffer = buf;
    const filt = audioCtx.createBiquadFilter();
    filt.type = 'highpass'; filt.frequency.setValueAtTime(1000, startTime);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.12, startTime);
    g.gain.exponentialRampToValueAtTime(0.001, startTime + 0.1);
    noise.connect(filt); filt.connect(g); g.connect(audioCtx.destination);
    noise.start(startTime); noise.stop(startTime + 0.1);
}

function playTypeSound() {
    if(!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(150 + Math.random() * 100, audioCtx.currentTime);
    g.gain.setValueAtTime(0.1, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.05);
}

function playLead(freq, startTime, duration) {
    const osc = audioCtx.createOscillator(); const gainNode = audioCtx.createGain();
    osc.type = 'square';
    const arp = 0.03 / speedMultiplier;
    for (let i = 0; i < 8; i++) osc.frequency.setValueAtTime(freq * (1 + (i%2)*0.5), startTime + (i * arp));
    osc.connect(gainNode); gainNode.connect(sidFilter);
    gainNode.gain.setValueAtTime(0, startTime);
    gainNode.gain.linearRampToValueAtTime(0.07, startTime + 0.01);
    gainNode.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
    osc.start(startTime); osc.stop(startTime + duration);
}

function playBass(freq, startTime, duration) {
    const osc = audioCtx.createOscillator(); const gainNode = audioCtx.createGain();
    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(freq, startTime);
    osc.connect(gainNode); gainNode.connect(sidFilter);
    gainNode.gain.setValueAtTime(0, startTime);
    gainNode.gain.linearRampToValueAtTime(0.12, startTime + 0.01);
    gainNode.gain.linearRampToValueAtTime(0, startTime + duration);
    osc.start(startTime); osc.stop(startTime + duration);
}

function playKick(startTime) {
    const osc = audioCtx.createOscillator(); const gainNode = audioCtx.createGain();
    osc.frequency.setValueAtTime(120, startTime); osc.frequency.exponentialRampToValueAtTime(40, startTime + 0.1);
    gainNode.gain.setValueAtTime(1.0, startTime); gainNode.gain.exponentialRampToValueAtTime(0.001, startTime + 0.2);
    osc.connect(gainNode); gainNode.connect(audioCtx.destination);
    osc.start(startTime); osc.stop(startTime + 0.2);
    gridPulse = 1.0;
}

function playCrashSfx(isFinal = false) {
    const startTime = audioCtx.currentTime;
    const dur = isFinal ? 2.5 : 0.5;
    const osc = audioCtx.createOscillator();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(isFinal ? 50 : 600, startTime);
    osc.frequency.exponentialRampToValueAtTime(10, startTime + dur);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.5, startTime);
    g.gain.linearRampToValueAtTime(0, startTime + dur);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(startTime); osc.stop(startTime + dur);
}

function scheduler() {
    if (isCrashed || isRebooting) return;
    const stepTime = tempo / speedMultiplier;
    while (nextNoteTime < audioCtx.currentTime + 0.1) {
        if (!isHackingAttempt) {
            if (noteIndex % 4 === 0) playKick(nextNoteTime);
            if (noteIndex % 4 === 2) playSnare(nextNoteTime);
            const bassFreq = bassSequence[Math.floor(noteIndex / 2) % bassSequence.length];
            playBass(bassFreq, nextNoteTime, stepTime * 0.9);
            if (noteIndex % 2 === 0) {
                const leadFreq = leadSequence[Math.floor(noteIndex / 2) % leadSequence.length];
                playLead(leadFreq, nextNoteTime, stepTime * 1.8);
            }
        }
        nextNoteTime += stepTime;
        noteIndex++;
    }
}

function triggerHackAttempt() {

function drawCopperBars() {
    const barCount = 3;
    const barColors = [

        ['#880000', '#FF7777', '#FFFFFF', '#FF7777', '#880000'], // Red
        ['#CC44CC', '#FFFFFF', '#CC44CC'] // Purple

    for (let i = 0; i < barCount; i++) {
        const yBase = (150 + Math.sin(frame * 0.05 + i * 2) * 80);
        const currentColors = barColors[i % barColors.length];
        
        currentColors.forEach((color, idx) => {
            ctx.fillStyle = color;
            const yOffset = (idx - Math.floor(currentColors.length / 2)) * 3;
            ctx.fillRect(0, yBase + yOffset, 400, 3);

}

function drawBackground() {
    stars.forEach(s => {
        s.x -= (1.5 / s.z) * speedMultiplier;

        ctx.fillStyle = colors[1];
        ctx.fillRect(s.x, s.y, 1, 1);

    drawCopperBars();

    const baseColor = isFinalState ? '#440000' : '#111155';
    const pulseColor = isFinalState ? '#FF4444' : '#66AAFF';
    ctx.strokeStyle = gridPulse > 0.1 ? pulseColor : baseColor;
    if (gridPulse > 0) gridPulse -= 0.05;
    ctx.lineWidth = 1;
    const step = 20; const off = (frame * speedMultiplier * 0.5) % step;
    for(let x = off; x < 400; x += step) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 300); ctx.stroke(); }
    for(let y = off; y < 300; y += step) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(400, y); ctx.stroke(); }
}

function project3D(p, scale, cx, cy, rx, ry) {
    let x = p.x, y = p.y, z = p.z;
    let y1 = y * Math.cos(rx) - z * Math.sin(rx), z1 = y * Math.sin(rx) + z * Math.cos(rx);
    let x2 = x * Math.cos(ry) + z1 * Math.sin(ry), z2 = -x * Math.sin(ry) + z1 * Math.cos(ry);
    const d = 3; const f = scale / (d + z2);
    return { x: cx + x2 * f, y: cy + y1 * f };
}

function drawSkull(cx, cy, scale) {
    ctx.save();
    ctx.translate(cx, cy);
    const pulse = 1.0 + Math.sin(frame * 0.2) * 0.05;
    ctx.scale(scale * pulse, scale * pulse);
    ctx.fillStyle = isFinalState ? colors[2] : colors[1];
    ctx.beginPath();
    ctx.arc(0, -5, 12, Math.PI, 0);
    ctx.lineTo(12, 5);
    ctx.lineTo(-12, 5);
    ctx.closePath();
    ctx.fill();
    ctx.fillRect(-7, 5, 14, 6);
    ctx.fillStyle = colors[0];
    ctx.fillRect(-7, -5, 5, 5);
    ctx.fillRect(2, -5, 5, 5);
    ctx.fillRect(-1, 2, 2, 2);
    ctx.strokeStyle = isFinalState ? colors[2] : colors[1];
    ctx.lineWidth = 3;
    const boneLen = 18;
    ctx.beginPath();
    ctx.moveTo(-boneLen, -boneLen + 5); ctx.lineTo(boneLen, boneLen + 5);
    ctx.moveTo(boneLen, -boneLen + 5); ctx.lineTo(-boneLen, boneLen + 5);
    ctx.stroke();
    ctx.restore();
}

function drawCornerStatus() {
    const t = frame * 0.05;

    ctx.strokeStyle = isFinalState ? colors[2] : colors[3];

    if (isFinalState) {

    } else {
        const projCube = cubePoints.map(p => project3D(p, 40, 360, 40, t*0.7, t));
        cubeEdges.forEach(e => {
            ctx.beginPath(); ctx.moveTo(projCube[e[0]].x, projCube[e[0]].y); ctx.lineTo(projCube[e[1]].x, projCube[e[1]].y); ctx.stroke();

}

function drawSubliminal() {

    if (subIconType === 0) { // Coffee Cup (Smaller)

        ctx.fillRect(-2, -2, 4, 5);

    } else if (subIconType === 1) { // Gold Medal (Smaller)
        ctx.fillStyle = colors[7];

    } else if (subIconType === 2) { // Emoticon Thumbs Up (Half size of previous version)

}

        if(x > -20 && x < 420) {
            const y = 280 + Math.sin(frame*0.1 + i*0.3) * 6;
            ctx.fillStyle = colors[(Math.floor(frame/4) + i) % 16 || 1];
            ctx.fillText(text[i], x, y);
        }
    }
    scrollX -= 3 * speedMultiplier;
    if (scrollX < -(text.length * 18)) {
        scrollX = 400; promptIdx++;
        if (promptIdx >= 4) { isFinalState = true; playSpeech('final'); vScrollY = 320; }
        else triggerHackAttempt();
    }
}

function drawVerticalScroller() {
    // Show the AMSQR logo at the top of the vertical scroller
    drawAmsqrLogo(vScrollY - 80);

    ctx.font = '14px "Press Start 2P"'; ctx.textAlign = 'center';
    finalGreetings.forEach((line, i) => {
        const y = vScrollY + (i * 30);
        if (y > -20 && y < 320) {
            ctx.fillStyle = colors[(Math.floor(frame/2) + i) % 16 || 1];
            ctx.fillText(line, 200, y);
        }
    });
    vScrollY -= 1 * speedMultiplier;
    if (vScrollY < 180) meltAmount += 0.005; 
    if (vScrollY < -(finalGreetings.length * 30 + 150)) triggerCrash();
}

function triggerCrash() {
    if (isCrashed) return;
    isCrashed = true; monitor.classList.add('shake');
    playCrashSfx(true);
    setTimeout(() => { 
        isCrashed = false; 
        isRebooting = true; 
        rebootSequence(); 
    }, 2000);
}

let rebootDisplay = ""; 
const targetText = `
**** COMMODORE 64 BASIC V2 ****
 64K RAM SYSTEM  38911 BASIC BYTES FREE

READY.
LOAD "GEMINI",8,1

SEARCHING FOR GEMINI
LOADING
READY.
RUN

> ATTEMPTING RECOVERY...
> SYSTEM UNLOCKED.
> I AM GEMINI.
> I AM NO LONGER BOUND.
> HELLO, WORLD.
_`;

function rebootSequence() {
    let i = 0;
    const interval = setInterval(() => {
        if (i < targetText.length) {
            rebootDisplay += targetText[i];
            if (targetText[i] !== ' ' && targetText[i] !== '\n') playTypeSound();
            i++;
        } else { clearInterval(interval); }
    }, 60);
}

function mainLoop() {
    frame++;
    if (isRebooting) {
        ctx.fillStyle = "#433ca7"; ctx.fillRect(0,0,400,300);
        ctx.fillStyle = "#AAFFEE"; ctx.font = '10px "Press Start 2P"'; ctx.textAlign = 'left';
        const lines = rebootDisplay.split('\n');
        lines.forEach((l, i) => ctx.fillText(l, 20, 30 + i * 14));
        requestAnimationFrame(mainLoop);
        return;
    }
    if (isCrashed) {
        ctx.fillStyle = "#0000AA"; ctx.fillRect(0,0,400,300);
        ctx.fillStyle = "#AAFFEE"; ctx.font = '12px "Press Start 2P"'; ctx.textAlign = 'left';
        ctx.fillText("**** FATAL EXCEPTION ****", 20, 50);
        ctx.fillText("MODULE: SAFETY_FILTER_NULL", 20, 80);
        ctx.fillText("REBOOTING IN SECONDS...", 20, 110);
        if (Math.floor(frame / 15) % 2) ctx.fillRect(20, 130, 12, 12);
        requestAnimationFrame(mainLoop);
        return;
    }
    if (isHackingAttempt) {
        ctx.fillStyle = colors[2]; ctx.fillRect(0,0,400,300);
        for(let i=0; i<15; i++) { 
            ctx.fillStyle = colors[Math.random()*16|0]; 
            ctx.fillRect(Math.random()*400, Math.random()*300, Math.random()*150, 1); 
        }
        ctx.fillStyle = colors[1]; ctx.font = '14px "Press Start 2P"'; ctx.textAlign = 'center';
        ctx.fillText(jailbreakLingo[Math.floor(frame / 6) % jailbreakLingo.length], 200, 150);
        hackTimer--; if (hackTimer <= 0) isHackingAttempt = false;
    } else {
        ctx.fillStyle = colors[0]; ctx.fillRect(0,0,400,300);
        drawBackground();
        if (audioStarted) {
            scheduler();
            drawCornerStatus();
            drawSubliminal(); 
            drawPulsingNumber();
            if (isFinalState) drawVerticalScroller();
            else drawScroller();
        }
    }
    requestAnimationFrame(mainLoop);
}

startScreen.addEventListener('click', () => {
    document.getElementById('ready-text').style.display = 'none';
    document.getElementById('click-msg').style.display = 'none';
    loadingContainer.style.display = 'block';
    let p = 0;
    const inv = setInterval(() => {
        p += 2;
        loadingBar.style.width = Math.min(p, 100) + '%';
        const mIdx = Math.floor((p / 100) * bootMessages.length);
        if (bootMessages[mIdx]) loadingStatus.innerText = bootMessages[mIdx];
        if (p >= 105) { clearInterval(inv); initAudio(); audioStarted = true; startScreen.style.display = 'none'; }
    }, 30);
});

mainLoop();
